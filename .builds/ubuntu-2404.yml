image: ubuntu/24.04

secrets:
  - b88a4c2c-944c-42a6-9fbb-7483049c458a

packages:
  # Build tools
  - software-properties-common
  - build-essential
  # Python is 3.12
  - python3-dev
  - python3-pip
  # Extra
  - nodejs

tasks:
  - setup: |
      echo "Building on Ubuntu 2404"
      sudo pip install --break-system-packages -U uv nox
      cd hox-cli
      uv sync

  - test: |
      cd hox-cli
      uv run pytest -q --tb=short
  - lint: |
      cd hox-cli
      uv run ruff check
      # uv run ty check src
  - nox: |
      cd hox-cli
      uvx nox
