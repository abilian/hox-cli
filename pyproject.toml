[project]
name = "hox-cli"
version = "0.1.0"
description = "Deploy and manage applications on SlapOS (Rapid.Space) from the terminal"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Abilian SAS" }]
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=5.3",
    "httpx2>=2.16",
    "packaging>=24",
]

[project.urls]
Repository = "https://github.com/abilian/hox-cli"
Issues = "https://github.com/abilian/hox-cli/issues"
Changelog = "https://github.com/abilian/hox-cli/blob/main/CHANGES.md"

[project.scripts]
hox = "hox_cli.cli:run"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "nox>=2026.10.20",
    "pre-commit>=4.7.0",
    "pyrefly>=1.4.1",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "tepyd>=0.9.1",
    "ty>=0.0.99",
    "zuban>=0.10.2",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.tepyd]
# Generated by `tepyd init` — review and adjust.
src_root = "src/hox_cli"
src_package = "hox_cli"
units = ["*.py"]
# counter = "internal"   # or "cloc"

# Source units to exclude from analysis (a reason is required):
# [tool.tepyd.exclude]
# faker = "why this is not tested"

# Tiers, cheapest first. Add `expects = [...]` to a tier to scope it to
# the source units it should test (glob patterns over unit names); units
# outside the scope are reported n/a, not as gaps. Use it when layers map
# to tiers — e.g. integration `expects = ["repositories/*", "infra/*"]`,
# e2e `expects = ["web/*"]`. Omit it and the tier is checked against all.

[[tool.tepyd.tiers]]
name = "a_unit"
root = "tests/a_unit"
label = "unit"
target_share = 0.6

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[[tool.tepyd.tiers]]
name = "b_integration"
root = "tests/b_integration"
label = "integration"

[[tool.tepyd.tiers]]
name = "c_e2e"
root = "tests/c_e2e"
label = "e2e"
