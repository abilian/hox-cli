# hox-cli documentation: Zensical configuration

[project]
site_name = "hox-cli"
site_description = "Drive SlapOS on Rapid.Space from the terminal: build, deploy and check software releases without the web panel"
site_author = "Abilian SAS"
docs_dir = "src"
site_dir = "site"
repo_url = "https://github.com/abilian/hox-cli"
repo_name = "abilian/hox-cli"
edit_uri = "edit/main/docs/src"
copyright = "Copyright &copy; 2026 Abilian SAS"

nav = [
    { "Home" = [
        { "Overview" = "index.md" },
    ]},
    { "Get Started" = [
        { "Installation" = "get-started/installation.md" },
        { "Configuration" = "get-started/configuration.md" },
        { "First Deploy" = "get-started/first-deploy.md" },
    ]},
    { "Guides" = [
        { "The Development Loop" = "guides/dev-loop.md" },
        { "Releases and Instances" = "guides/releases.md" },
        { "Diagnosing Problems" = "guides/diagnosing.md" },
        { "Porting Hop3 Apps" = "guides/porting-hop3.md" },
        { "Python Dependencies" = "guides/python-versions.md" },
        { "Setting Up a Node" = "guides/new-node.md" },
    ]},
    { "Reference" = [
        { "Commands" = "reference/cli.md" },
        { "hox.toml" = "reference/config.md" },
        { "SlapOS Master Behaviour" = "reference/slapos-master.md" },
        { "Glossary" = "reference/glossary.md" },
    ]},
    { "Developers" = [
        { "Contributing" = "developers/contributing.md" },
        { "Architecture" = "developers/architecture.md" },
    ]},
]

[project.theme]
variant = "modern"
language = "en"
features = [
    "content.action.edit",
    "content.code.copy",
    "navigation.footer",
    "navigation.instant",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "purple"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
# Lucide has no brand icons: the default repository icon would fail the build.
repo = "fontawesome/brands/github"

[project.plugins]
search = { enabled = true }
