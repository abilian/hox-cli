# Example hox.toml. Copy it to the root of your workspace, next to the
# checkouts of your software repositories: hox looks for hox.toml in the
# current directory and its parents. Relative paths are relative to its
# directory. Reference: docs/src/reference/config.md.

[master]
url = "https://slap.vifib.com/"
# Client certificate, from `slapos configure client`.
cert = "~/.slapos/client.crt"
key = "~/.slapos/client.key"
# Rapid.Space's API serves slap.vifib.com's certificate: verify it under that name.
api_tls_name = "slap.vifib.com"

[project]
reference = "PROJ-20260101.001-0A1B2C"  # your project, as the panel shows it

[node]
# The compute node's title on the master. hox looks its reference up by
# title, so a node registered again needs no change here.
title = "my-node"
# How to run a command on the node as root; hox appends the command.
ssh = ["ssh", "-F", "ssh_config", "-o", "LogLevel=ERROR", "my-node"]
# For `hox re6st-token` only: Rapid.Space's re6st registry.
re6st_project = "PROJ-112"
re6st_release = "https://lab.nexedi.com/nexedi/slapos/-/raw/1.0.404/software/re6stnet/software.cfg"

# One table per software release you develop.
[software.my-app]
repo = "my-org/slapos"  # GitHub repository the node fetches the release from
checkout = "slapos"  # local clone of it
branch = "my-app"  # gives the branch URL
path = "software/my-app/software.cfg"
software_type = "default"
product = "my-app"  # Software Product title; its Allocation Supply is "my-app on my-node"
# Instance name. An instance stays on the node it was first requested on:
# a new node, or a new URL with `hox request --replace`, means a new name.
instance = "my-app-1"
# Services of etc/service that exit once their work is done, so that their
# exit doesn't count as a failure.
# one_shot = ["my_app_initdb"]

# The instance's parameters, sent with every `hox request` (and `hox deploy`):
# this table replaces those the instance has; without it, they stay as they are.
# The master stores them in clear, and the project's members see them in the panel.
# [software.my-app.parameters]
# ENVIRONMENT = "production"

# Checks run by `hox check`, `hox rebuild` and `hox deploy`, with curl on the
# node. URLs take the instance's connection parameters ({backend-url}, {url},
# or whatever your release publishes); a check whose parameter isn't
# published yet fails with that reason.
[[software.my-app.checks]]
name = "backend"
url = "{backend-url}/"
expect_status = 200

[[software.my-app.checks]]
name = "frontend"
url = "{url}/"
expect_status = 200

[[software.my-app.checks]]
name = "CORS"
url = "{backend-url}/api"
headers = { Origin = "https://example.org" }
expect_header = { access-control-allow-origin = "https://example.org" }
