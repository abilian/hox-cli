# WordPress, with MariaDB, pinned (automatic updates off) and with its URL
# from the platform, not from the request's Host header.
[software.wordpress-deny]
repo = "abilian/slapos_abilian_edge"
checkout = "slapos"
branch = "hop3-experiment"
path = "software/wordpress-deny/software.cfg"
software_type = "default"
product = "wordpress-deny"
instance = "wordpress-1"

# Over plain http the login page redirects to the site's https URL: the
# backend check says it came through https, as the frontend would.
[[software.wordpress-deny.checks]]
name = "backend"
url = "{backend-url}/wp-login.php"
headers = { "X-Forwarded-Proto" = "https" }
expect_status = 200

[[software.wordpress-deny.checks]]
name = "frontend"
url = "{url}/wp-login.php"
expect_status = 200

[[software.wordpress-deny.checks]]
name = "recipe files denied"
url = "{url}/scripts/setup-config.sh"
