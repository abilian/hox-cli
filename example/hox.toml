# The hox.toml that built and deployed 21 applications on one SlapOS compute
# node on Rapid.Space, in November 2026: three apps on the python-app stack,
# and 18 apps of the Hop3 catalog ported with `hox port`. See README.md.
#
# Copy it to the root of a workspace that holds a clone of
# abilian/slapos_abilian_edge in `slapos/`: hox looks for hox.toml in the
# current directory and its parents, and relative paths (`checkout`, ssh's
# -F) resolve against the file's directory.
#
# Values to replace with yours: [project] reference, [node] title and ssh,
# and every `instance` name (names are per project).

[master]
url = "https://slap.vifib.com/"
# Client certificate, from `slapos configure client`.
cert = "~/.slapos/client.crt"
key = "~/.slapos/client.key"
# Rapid.Space's API serves slap.vifib.com's certificate: verify it under that name.
api_tls_name = "slap.vifib.com"

[project]
reference = "PROJ-20261026.009-F09D5B"  # ours: yours is in the panel

[node]
# Our node's title on the master. hox looks its reference up by title, so a
# node registered again (a new reference) needs no change here.
title = "hox-node"
# Root on the node through a jump host, configured in an ssh_config next to
# this file. hox appends the command to run.
ssh = ["ssh", "-F", "node-deployer/ssh_config", "-o", "LogLevel=ERROR", "hox-node"]
# For `hox re6st-token` only: Rapid.Space's re6st registry.
re6st_project = "PROJ-112"
re6st_release = "https://lab.nexedi.com/nexedi/slapos/-/raw/1.0.404/software/re6stnet/software.cfg"

# Every table below has the same seven keys:
# - repo, branch, path: the release URL the node fetches,
#   https://raw.githubusercontent.com/<repo>/<branch>/<path>;
# - checkout: a local clone of repo, for the git checks (pushed? served?);
# - software_type: almost always "default";
# - product: the Software Product's title; `hox setup` creates it and an
#   Allocation Supply titled "<product> on <node title>";
# - instance: the instance's name. An instance stays on the node and URL it
#   was first requested with: a new node or a new URL means a new name.
#
# Then the checks, run with curl on the node by `hox check`, `hox rebuild` and
# `hox deploy`. Each software checks the same page on the backend (the
# partition's address, over re6st) and on the frontend (the public https
# address): the first shows the app runs, the second that Rapid.Space routes
# to it. hox doesn't follow redirects, so a check names the page a redirect
# would land on.


# ===========================================================================
# Apps on the python-app stack (stack/python-app/), written by hand
# ===========================================================================

# mynij-proxy: a small Flask proxy, the first app ported. Branch python-app.
[software.mynij-proxy]
repo = "abilian/slapos_abilian_edge"
checkout = "slapos"
branch = "python-app"
path = "software/mynij-proxy/software.cfg"
software_type = "default"
product = "mynij-proxy"
instance = "mynij-proxy-5"

[[software.mynij-proxy.checks]]
name = "backend ping"
url = "{backend-url}/ping"
expect_status = 200

[[software.mynij-proxy.checks]]
name = "frontend ping"
url = "{url}/ping"
expect_status = 200

# The proxy's reason to exist: it answers with the CORS header.
[[software.mynij-proxy.checks]]
name = "CORS"
url = "{backend-url}/proxy?url=https://example.org/"
headers = { Origin = "https://example.org" }
expect_header = { access-control-allow-origin = "https://example.org" }

# Abilian SBE: a large Flask/PostgreSQL collaborative app.
[software.abilian-sbe]
repo = "abilian/slapos_abilian_edge"
checkout = "slapos"
branch = "hop3-experiment"
path = "software/abilian-sbe/software.cfg"
software_type = "default"
product = "abilian-sbe"
instance = "abilian-sbe-1"
# Three setup jobs that run at each start from etc/service and exit when done:
# without this list, `hox instances` would count them as down.
one_shot = ["sbe_assets", "sbe_create_admin", "sbe_initdb"]

# SBE serves only its frontend's domain (FLASK_SERVER_NAME): its backend
# answers 404 to its own address, which still shows gunicorn is up.
[[software.abilian-sbe.checks]]
name = "backend"
url = "{backend-url}/"
expect_status = 404

[[software.abilian-sbe.checks]]
name = "frontend"
url = "{url}/"
expect_status = 200

# AIPress24: a Flask app, deployed blank (empty database, no S3, mail or
# Stripe).
[software.aipress24]
repo = "abilian/slapos_abilian_edge"
checkout = "slapos"
branch = "hop3-experiment"
path = "software/aipress24/software.cfg"
software_type = "default"
product = "aipress24"
instance = "aipress24-2"

# Instance parameters, exported to the app's processes under these names, as
# `hop3 config set` would. Sent with every `hox request` and `hox deploy`. The
# master stores them in clear, and the project's members see them in the
# panel. Our real values are not in this example.
[software.aipress24.parameters]
FLASK_MAIL_DEFAULT_SENDER = "contact@example.org"
FLASK_BOOTSTRAP_ADMIN_EMAIL = "admin@example.org"
FLASK_BOOTSTRAP_ADMIN_PASSWORD = "change-me"

# The health page queries the users table: the app and its database are up.
[[software.aipress24.checks]]
name = "backend health"
url = "{backend-url}/system/health"
expect_status = 200

[[software.aipress24.checks]]
name = "frontend health"
url = "{url}/system/health"
expect_status = 200


